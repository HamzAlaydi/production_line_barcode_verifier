[Scanner]
# Output file for scan results
output_file = data/scan_results.txt

# Scan interval in seconds
scan_interval = 1.0

# Simulate camera for testing (set to false in production)
simulate_camera = true

# Maximum scans to display in chart
max_chart_scans = 15

[Display]
# Screen resolution (Raspberry Pi 5" touchscreen)
screen_width = 800
screen_height = 480

# Enable fullscreen mode
fullscreen = false

[Logging]
# Log file location
log_file = logs/scanner.log

# Log level: DEBUG, INFO, WARNING, ERROR, CRITICAL
log_level = INFO

# Maximum log file size in MB
max_log_size = 10

# Number of backup log files to keep
backup_count = 3

[Theme]
# Color scheme
bg_primary = #0a0e14
bg_secondary = #151b23
bg_card = #1a2029
accent_cyan = #00d9ff
accent_magenta = #ff006e
accent_lime = #39ff14
accent_blue = #0080ff
accent_red = #ff3366
text_white = #ffffff
text_dim = #6a7a8a
text_bright = #e0e8f0

